name: Run Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: "13 0 1 * *"

permissions:
      actions: read # An explanation.

jobs:
  benchmarks:
    name: Run Benchmarks
    runs-on: ubuntu-latest

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}

    permissions:
      security-events: write # An explanation.
      actions: read # An explanation.

    steps:
      - name: Download djot-implementations
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Lua and LuaRocks
        run: |
          $GITHUB_WORKSPACE/sh/install-lua-debian.sh

      - name: Install PHP and Composer
        run: |
          $GITHUB_WORKSPACE/sh/install-php-debian.sh

      - name: Install Djots, Hyperfine, and Scryer
        run: |
          $GITHUB_WORKSPACE/sh/install-djots.sh

      - name: Run Benchmarks, Save Markdown File
        run: |
          cd "$GITHUB_WORKSPACE"
          sh/benchmarks.sh

      - name: cat Markdown File
        run: |
          cat  $GITHUB_WORKSPACE/tmp/benchmarks.md
